<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente del puente y nodos -->
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a56db" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="archGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ISOTIPO: PUENTE TECNOLÓGICO Y HUMANO -->
  <g transform="translate(10, 8)" filter="url(#shadow)">
    <!-- Base del soporte izquierdo -->
    <rect x="10" y="44" width="12" height="34" rx="4" fill="#1e293b" />
    <!-- Base del soporte derecho -->
    <rect x="66" y="44" width="12" height="34" rx="4" fill="#1e293b" />
    
    <!-- Tablero del puente (línea horizontal de conexión) -->
    <rect x="6" y="40" width="76" height="8" rx="4" fill="url(#bridgeGrad)" />
    
    <!-- Arco superior del puente (cálido y contenedor) -->
    <path d="M 16 42 Q 44 8 72 42" fill="none" stroke="url(#archGrad)" stroke-width="6" stroke-linecap="round" />
    
    <!-- Tirantes de conexión tecnológica -->
    <line x1="30" y1="23" x2="30" y2="40" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="2,2" />
    <line x1="44" y1="14" x2="44" y2="40" stroke="#0284c7" stroke-width="3" />
    <line x1="58" y1="23" x2="58" y2="40" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="2,2" />

    <!-- Nodos luminosos de conexión digital -->
    <circle cx="16" cy="42" r="5" fill="#f59e0b" />
    <circle cx="44" cy="14" r="6" fill="#059669" />
    <circle cx="72" cy="42" r="5" fill="#f59e0b" />
    <circle cx="44" cy="44" r="4.5" fill="#ffffff" stroke="#1a56db" stroke-width="2" />
  </g>

  <!-- LOGOTIPO / TIPOGRAFÍA -->
  <g transform="translate(105, 12)">
    <!-- Texto Principal: PUENTE DIGITAL -->
    <text x="0" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#0f172a" letter-spacing="-0.5">
      Puente<tspan fill="#1a56db">Digital</tspan>
    </text>
    
    <!-- Lema descriptivo accesible -->
    <text x="2" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#059669" letter-spacing="0.2">
      ALFABETIZACIÓN DIGITAL • PERSONAS MAYORES
    </text>
  </g>
</svg>
