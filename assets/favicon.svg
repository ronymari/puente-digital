<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007ce8" />
      <stop offset="100%" stop-color="#0b2545" />
    </linearGradient>
    <linearGradient id="haloGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
  </defs>
  <!-- Fondo redondeado con gradiente azul oficial -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Aura clara circular -->
  <circle cx="32" cy="27" r="19" fill="url(#haloGrad)" />

  <!-- Destellos amarillos de alegría -->
  <path d="M 47 13 L 50 11 M 49 17 L 53 17" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Dos personas mayores felices (abuelos) -->
