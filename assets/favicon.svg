  <circle cx="26" cy="23" r="7.5" fill="#fde68a" />
  <path d="M 19 21 Q 26 14 33 21" fill="#ffffff" />
  <circle cx="23.5" cy="23" r="2.2" fill="none" stroke="#0b2545" stroke-width="1.2" />
  <circle cx="28.5" cy="23" r="2.2" fill="none" stroke="#0b2545" stroke-width="1.2" />
  <!-- Sonrisa abuelo -->
  <path d="M 24 26 Q 26 28 28 26" fill="none" stroke="#0b2545" stroke-width="1.2" stroke-linecap="round" />
  <!-- Barba abuelo -->
  <path d="M 22 26 Q 26 31 30 26 Z" fill="#ffffff" />

